<!-- Page Logic -->
<script class="">
        document.addEventListener('DOMContentLoaded', () => {
            // --- 1. DOM Elements ---
            const form = document.getElementById('login-form');
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const togglePasswordBtn = document.getElementById('toggle-password');
            const toggleIcon = document.getElementById('toggle-icon');
            const submitBtn = document.getElementById('submit-btn');
            const submitSpinner = document.getElementById('submit-spinner');
            const errorToast = document.getElementById('login-error');
            const errorMessage = document.getElementById('error-message');

            // --- 2. Event Listeners ---
            
            // Password Visibility Toggle
            togglePasswordBtn.addEventListener('click', () => {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                toggleIcon.textContent = type === 'password' ? 'visibility_off' : 'visibility';
            });

            // Clear errors on input
            [emailInput, passwordInput].forEach(input => {
                input.addEventListener('input', () => {
                    hideError();
                    input.classList.remove('border-error', 'focus:border-error', 'focus:ring-error');
                });
            });

            // Form Submission
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                if (validateForm()) {
                    setLoadingState(true);
                    
                    // --- 4. Backend Integration (Mock) ---
                    // API endpoint: POST /api/login
                    // Payload: { email: '...', password: '...', remember: true/false }
                    
                    try {
                        // Simulate network request
                        await new Promise(resolve => setTimeout(resolve, 1500));
                        
                        // Mock success based on email pattern (for demo)
                        if (emailInput.value.includes('error')) {
                            throw new Error('Invalid credentials. Please try again.');
                        }
                        
                        // Success redirect would happen here
                        console.log('Login successful');
                        submitBtn.querySelector('span:not(.material-symbols-outlined)').textContent = 'Success';
                        submitBtn.classList.replace('bg-primary', 'bg-surface-tint'); // Visual feedback
                        
                    } catch (err) {
                        showError(err.message);
                    } finally {
                        setLoadingState(false);
                    }
                }
            });

            // --- 3. Validation & UI Functions ---
            function validateForm() {
                let isValid = true;
                
                if (!emailInput.value || !/^\S+@\S+\.\S+$/.test(emailInput.value)) {
                    emailInput.classList.add('border-error', 'focus:border-error', 'focus:ring-error');
                    isValid = false;
                }
                
                if (!passwordInput.value || passwordInput.value.length < 6) {
                    passwordInput.classList.add('border-error', 'focus:border-error', 'focus:ring-error');
                    isValid = false;
                }

                if (!isValid) {
                    showError('Please provide a valid email and password.');
                }
                
                return isValid;
            }

            function showError(msg) {
                errorMessage.textContent = msg;
                errorToast.classList.remove('hidden');
                // Shake effect for error
                errorToast.animate([
                    { transform: 'translateX(0)' },
                    { transform: 'translateX(-5px)' },
                    { transform: 'translateX(5px)' },
                    { transform: 'translateX(0)' }
                ], { duration: 300, easing: 'ease-in-out' });
            }

            function hideError() {
                errorToast.classList.add('hidden');
            }

            function setLoadingState(isLoading) {
                const btnText = submitBtn.querySelector('span:not(.material-symbols-outlined)');
                if (isLoading) {
                    submitBtn.disabled = true;
                    btnText.classList.add('opacity-0');
                    submitSpinner.classList.remove('hidden');
                    submitBtn.classList.add('cursor-not-allowed', 'opacity-80');
                } else {
                    submitBtn.disabled = false;
                    btnText.classList.remove('opacity-0');
                    submitSpinner.classList.add('hidden');
                    submitBtn.classList.remove('cursor-not-allowed', 'opacity-80');
                }
            }
        });
    </script>
