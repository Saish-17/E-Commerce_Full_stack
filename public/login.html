        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
</style>
<script src="/js/main.js"></script>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('login-form');
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const togglePasswordBtn = document.getElementById('toggle-password');
            const toggleIcon = document.getElementById('toggle-icon');
            const submitBtn = document.getElementById('submit-btn');
            const submitSpinner = document.getElementById('submit-spinner');
            const errorToast = document.getElementById('login-error');
            const errorMessage = document.getElementById('error-message');

            togglePasswordBtn.addEventListener('click', () => {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                toggleIcon.textContent = type === 'password' ? 'visibility_off' : 'visibility';
            });

            [emailInput, passwordInput].forEach(input => {
                input.addEventListener('input', () => {
                    hideError();
                    input.classList.remove('border-error', 'focus:border-error', 'focus:ring-error');
                });
            });

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                if (validateForm()) {
                    setLoadingState(true);
                    try {
                        const response = await fetch('/api/auth/login', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                email: emailInput.value,
                                password: passwordInput.value
                            })
                        });
                        
                        const data = await response.json();
                        
                        if (!response.ok) {
                            throw new Error(data.message || 'Login failed.');
                        }
                        
                        localStorage.setItem('token', data.token);
                        localStorage.setItem('user', JSON.stringify(data.user));
                        
                        showToast('Sign in successful', 'success');
                        
                        submitBtn.querySelector('span').textContent = 'Success';
                        submitBtn.classList.replace('bg-primary', 'bg-surface-tint');
                        
                        setTimeout(() => {
                            if (data.user.role === 'admin') {
                                window.location.href = '/admin.html';
                            } else {
                                window.location.href = '/index.html';
                            }
                        }, 1000);
                        
                    } catch (err) {
                        showError(err.message);
                    } finally {
                        setLoadingState(false);
                    }
                }
            });

            function validateForm() {
                let isValid = true;
                if (!emailInput.value || !/^\S+@\S+\.\S+$/.test(emailInput.value)) {
                    emailInput.classList.add('border-error', 'focus:border-error', 'focus:ring-error');
                    isValid = false;
                }
                if (!passwordInput.value || passwordInput.value.length < 6) {
                    passwordInput.classList.add('border-error', 'focus:border-error', 'focus:ring-error');
                    isValid = false;
                }
                if (!isValid) {
                    showError('Please provide a valid email and password (min 6 characters).');
                }
                return isValid;
            }

            function showError(msg) {
                errorMessage.textContent = msg;
                errorToast.classList.remove('hidden');
                errorToast.animate([
                    { transform: 'translateX(0)' },
                    { transform: 'translateX(-5px)' },
                    { transform: 'translateX(5px)' },
                    { transform: 'translateX(0)' }
                ], { duration: 300, easing: 'ease-in-out' });
            }

            function hideError() {
                errorToast.classList.add('hidden');
            }

            function setLoadingState(isLoading) {
                const btnText = submitBtn.querySelector('span');
                if (isLoading) {
                    submitBtn.disabled = true;
                    btnText.classList.add('opacity-0');
                    submitSpinner.classList.remove('hidden');
                    submitBtn.classList.add('cursor-not-allowed', 'opacity-80');
                } else {
                    submitBtn.disabled = false;
                    btnText.classList.remove('opacity-0');
                    submitSpinner.classList.add('hidden');
                    submitBtn.classList.remove('cursor-not-allowed', 'opacity-80');
                }
            }
        });
    </script>
