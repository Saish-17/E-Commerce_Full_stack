<script src="/js/main.js"></script>
<script>
        const CONFIG = {
            apiUrl: '/api/products'
        };

        let state = {
            products: [],
            filters: {
                categories: [],
                priceMin: null,
                priceMax: null,
                rating: 'all',
                search: ''
            },
            sortBy: 'featured'
        };

        const DOM = {
            categoryCheckboxes: document.querySelectorAll('input[value="Apparel"], input[value="Accessories"], input[value="Footwear"]'),
            priceMinInput: document.getElementById('price-min'),
            priceMaxInput: document.getElementById('price-max'),
            applyPriceBtn: document.getElementById('apply-price-btn'),
            ratingRadios: document.querySelectorAll('input[name="rating"]'),
            clearFiltersBtn: document.getElementById('clear-filters-btn'),
            sortSelect: document.getElementById('sort-select'),
            productGrid: document.getElementById('product-grid'),
            productCount: document.getElementById('product-count'),
            searchInput: document.getElementById('search-input')
        };

        function setupEventListeners() {
            DOM.categoryCheckboxes.forEach(cb => cb.addEventListener('change', handleCategoryChange));
            DOM.applyPriceBtn.addEventListener('click', handlePriceChange);
            DOM.ratingRadios.forEach(radio => radio.addEventListener('change', handleRatingChange));
            DOM.sortSelect.addEventListener('change', handleSortChange);
            DOM.clearFiltersBtn.addEventListener('click', clearAllFilters);
            
            // Search input typing logic
            let debounceTimer;
            DOM.searchInput.addEventListener('input', (e) => {
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(() => {
                    state.filters.search = e.target.value;
                    fetchProducts();
                }, 400);
            });
        }

        function handleCategoryChange(e) {
            const value = e.target.value;
            if (e.target.checked) {
                if (!state.filters.categories.includes(value)) state.filters.categories.push(value);
            } else {
                state.filters.categories = state.filters.categories.filter(c => c !== value);
            }
            fetchProducts();
        }

        function handlePriceChange() {
            const min = parseFloat(DOM.priceMinInput.value);
            const max = parseFloat(DOM.priceMaxInput.value);
            if (validatePriceInput(min, max)) {
                state.filters.priceMin = isNaN(min) ? null : min;
                state.filters.priceMax = isNaN(max) ? null : max;
                fetchProducts();
            }
        }

        function handleRatingChange(e) {
            state.filters.rating = e.target.value;
            fetchProducts();
        }

        function handleSortChange(e) {
            state.sortBy = e.target.value;
            fetchProducts();
        }

        function clearAllFilters() {
            DOM.categoryCheckboxes.forEach(cb => cb.checked = false);
            DOM.priceMinInput.value = '';
            DOM.priceMaxInput.value = '';
            DOM.ratingRadios.forEach(r => { if(r.value === 'all') r.checked = true; });
            DOM.searchInput.value = '';
            
            state.filters = { categories: [], priceMin: null, priceMax: null, rating: 'all', search: '' };
            fetchProducts();
        }

        function validatePriceInput(min, max) {
            if (!isNaN(min) && !isNaN(max) && min > max) {
                showToast("Minimum price cannot be greater than maximum price.", "error");
                return false;
            }
            return true;
        }

        function renderProducts(products) {
            DOM.productCount.textContent = products.length;
            
            if (products.length === 0) {
                DOM.productGrid.innerHTML = `
                    <div class="col-span-full py-xl text-center flex flex-col items-center justify-center text-on-surface-variant">
                        <span class="material-symbols-outlined text-[48px] mb-sm opacity-50">shopping_bag</span>
                        <p class="font-headline-md text-headline-md mb-xs">No pieces found</p>
                        <p class="font-body-md text-body-md">Try expanding your price range or clearing search filters.</p>
                    </div>
                `;
                return;
            }

            DOM.productGrid.innerHTML = products.map((product, idx) => {
                // If it is the second card (index 1), let's render it as a wide element if space allows (per design bento grid card 2)
                const isWide = (idx === 1);
                if (isWide) {
                    return `
                        <article class="group bg-surface-container-lowest rounded-xl overflow-hidden hover:bg-surface-bright transition-all duration-300 flex flex-col md:col-span-2 md:flex-row border border-transparent hover:border-primary cursor-pointer" onclick="window.location.href='/product-details.html?id=${product.id}'">
                            <div class="relative w-full md:w-1/2 aspect-[4/5] md:aspect-auto bg-surface-container-low overflow-hidden">
                                <img src="${product.image_url}" alt="${product.name}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500 ease-out">
                                ${product.count_in_stock <= 5 ? `<div class="absolute top-sm left-sm bg-tertiary-container text-on-tertiary-container font-label-sm text-label-sm px-sm py-xs rounded-sm uppercase tracking-wide">Low Stock</div>` : ''}
                            </div>
                            <div class="p-md md:p-lg flex flex-col justify-center w-full md:w-1/2">
                                <p class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider mb-xs">${product.category}</p>
                                <h3 class="font-headline-md text-headline-md text-on-surface mb-sm">${product.name}</h3>
                                <p class="font-body-md text-body-md text-on-surface-variant mb-md line-clamp-3">${product.description}</p>
                                <div class="flex items-center gap-xs mb-md">
                                    <span class="material-symbols-outlined text-primary text-[16px]" style="font-variation-settings: 'FILL' 1;">star</span>
                                    <span class="font-label-sm text-label-sm text-on-surface-variant">${product.rating} (${product.num_reviews} reviews)</span>
                                </div>
                                <div class="mt-auto flex items-center justify-between">
                                    <p class="font-headline-lg text-headline-lg text-primary">$${product.price.toFixed(2)}</p>
                                    <button onclick="event.stopPropagation(); Cart.add({id: ${product.id}, name: '${product.name}', price: ${product.price}, image_url: '${product.image_url}'})" class="h-lg px-md bg-primary hover:bg-primary-container text-on-primary font-label-lg text-label-lg rounded-DEFAULT transition-colors flex items-center justify-center gap-xs">
                                        <span>Add</span>
                                        <span class="material-symbols-outlined text-[20px]">add_shopping_cart</span>
                                    </button>
                                </div>
                            </div>
                        </article>
                    `;
                }

                return `
                    <article class="group bg-surface-container-lowest rounded-xl overflow-hidden hover:bg-surface-bright transition-all duration-300 flex flex-col border border-transparent hover:border-primary cursor-pointer" onclick="window.location.href='/product-details.html?id=${product.id}'">
                        <div class="relative w-full aspect-[4/5] bg-surface-container-low overflow-hidden">
                            <img src="${product.image_url}" alt="${product.name}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500 ease-out">
                            <button onclick="event.stopPropagation(); showToast('Added to wishlist', 'success')" aria-label="Add to wishlist" class="absolute top-sm right-sm p-sm bg-surface-container-lowest/80 backdrop-blur-sm rounded-full text-on-surface-variant hover:text-primary hover:bg-surface-container-lowest transition-all opacity-0 group-hover:opacity-100 shadow-sm">
                                <span class="material-symbols-outlined text-[20px]">favorite_border</span>
                            </button>
                        </div>
                        <div class="p-md flex flex-col flex-grow">
                            <p class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider mb-xs">${product.category}</p>
                            <h3 class="font-headline-md text-headline-md text-on-surface mb-sm line-clamp-1">${product.name}</h3>
                            <div class="flex items-center gap-xs mb-md">
                                <span class="material-symbols-outlined text-primary text-[16px]" style="font-variation-settings: 'FILL' 1;">star</span>
                                <span class="font-label-sm text-label-sm text-on-surface-variant">${product.rating} (${product.num_reviews})</span>
                            </div>
                            <div class="mt-auto flex items-end justify-between">
                                <p class="font-headline-md text-headline-md text-primary">$${product.price.toFixed(2)}</p>
                                <button onclick="event.stopPropagation(); Cart.add({id: ${product.id}, name: '${product.name}', price: ${product.price}, image_url: '${product.image_url}'})" class="h-lg px-md bg-primary hover:bg-primary-container text-on-primary font-label-lg text-label-lg rounded-DEFAULT transition-colors flex items-center justify-center gap-xs">
                                    <span>Add</span>
                                    <span class="material-symbols-outlined text-[20px]">add_shopping_cart</span>
                                </button>
                            </div>
                        </div>
                    </article>
                `;
            }).join('');
        }

        async function fetchProducts() {
            try {
                // Build Query Parameters
                const params = new URLSearchParams();
                if (state.filters.search) params.append('search', state.filters.search);
                if (state.filters.categories.length > 0) params.append('category', state.filters.categories.join(','));
                if (state.filters.priceMin !== null) params.append('priceMin', state.filters.priceMin);
                if (state.filters.priceMax !== null) params.append('priceMax', state.filters.priceMax);
                if (state.filters.rating !== 'all') params.append('rating', state.filters.rating);
                if (state.sortBy) params.append('sort', state.sortBy);

                const response = await fetch(`${CONFIG.apiUrl}?${params.toString()}`);
                if (!response.ok) throw new Error('Network error fetching products');
                
                const data = await response.json();
                state.products = data.products;
                renderProducts(state.products);
            } catch (error) {
                console.error('Error fetching products:', error);
                showToast('Failed to load products. Please try again.', 'error');
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            setupEventListeners();
            
            // Check if there is category in url query
            const urlParams = new URLSearchParams(window.location.search);
            const initialCategory = urlParams.get('category');
            if (initialCategory) {
                state.filters.categories.push(initialCategory);
                const checkbox = document.querySelector(`input[value="${initialCategory}"]`);
                if (checkbox) checkbox.checked = true;
            }
            
            fetchProducts();
        });
    </script>
</body></html>
