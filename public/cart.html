    }catch(_e){}</script><meta charset="utf-8"></head><body class="bg-background text-on-background font-body-md antialiased flex flex-col min-h-screen">
<!-- TopNavBar -->
<nav class="w-full sticky top-0 z-50 bg-surface-container-lowest text-primary border-b border-surface-variant shadow-sm font-body-md font-body-md">
<div class="max-w-container-max mx-auto px-md flex justify-between items-center h-[80px]">
<a href="/index.html" class="font-display-lg text-display-lg font-bold text-primary hover:opacity-80 transition-opacity">LUXE</a>
<div class="hidden md:flex space-x-gutter items-center">
<a href="/index.html" class="text-secondary hover:text-primary hover:opacity-80 transition-opacity">Home</a>
<a href="/products.html" class="text-secondary hover:text-primary hover:opacity-80 transition-opacity">Products</a>
</div>
<div class="flex items-center space-x-md">
<button class="hover:opacity-80 transition-opacity p-2 rounded-full hover:bg-surface-container" aria-label="Shopping Cart">
<span class="material-symbols-outlined text-secondary">shopping_cart</span>
</button>
<button class="hover:opacity-80 transition-opacity p-2 rounded-full hover:bg-surface-container" aria-label="User Profile">
<span class="material-symbols-outlined text-secondary">person</span>
</button>
</div>
</div>
</nav>
<!-- Main Content Canvas -->
<main class="flex-grow max-w-container-max mx-auto w-full px-md md:px-margin-desktop py-xl">
<div class="mb-lg">
<h1 class="font-display-lg text-display-lg text-primary">Your Cart</h1>
<p class="text-secondary font-body-lg text-body-lg mt-xs">Review your selection before finalizing your orders.</p>
</div>
<div class="grid grid-cols-1 lg:grid-cols-12 gap-gutter items-start" id="cart-content-container">
<!-- Cart Items (Left - 8 cols) -->
<div class="lg:col-span-8 flex flex-col gap-md" id="cart-items-list">
<!-- Dynamically populated -->
</div>
<!-- Summary (Right - 4 cols) -->
<div class="lg:col-span-4">
<div class="bg-surface-container p-md rounded-lg sticky top-[100px]">
<h2 class="font-headline-md text-headline-md mb-md border-b border-outline-variant pb-sm">Order Summary</h2>
<div class="flex flex-col gap-sm mb-md font-body-md text-body-md">
<div class="flex justify-between">
<span class="text-on-surface-variant">Subtotal</span>
<span class="font-medium" id="summary-subtotal">$0.00</span>
</div>
<div class="flex justify-between">
<span class="text-on-surface-variant">Estimated Shipping</span>
<span class="font-medium text-primary" id="summary-shipping">FREE</span>
</div>
<div class="flex justify-between">
<span class="text-on-surface-variant">Tax</span>
<span class="font-medium" id="summary-tax">$0.00</span>
</div>
</div>
<div class="flex justify-between items-center border-t border-outline-variant pt-md mb-lg">
<span class="font-headline-md text-headline-md">Total</span>
<span class="font-headline-lg text-headline-lg text-primary" id="summary-total">$0.00</span>
</div>
<button id="checkout-btn" class="w-full h-lg bg-primary text-on-primary rounded font-label-lg text-label-lg flex items-center justify-center hover:opacity-90 transition-opacity">
                        Proceed to Checkout
                    </button>
</div>
</div>
</div>
</main>
<!-- Footer -->
<footer class="w-full mt-xl bg-surface-container">
<div class="max-w-container-max mx-auto px-md py-lg flex flex-col md:flex-row justify-between items-start gap-md">
<div>
<span class="font-headline-md text-headline-md font-bold text-primary">LUXE</span>
<p class="font-body-md text-body-md text-secondary mt-2">© 2024 LUXE Retail Group. All rights reserved.</p>
</div>
<div class="flex flex-col gap-2 font-body-md text-body-md">
<a class="text-secondary hover:text-primary underline transition-colors duration-200" href="#">Privacy Policy</a>
<a class="text-secondary hover:text-primary underline transition-colors duration-200" href="#">Terms of Service</a>
<a class="text-secondary hover:text-primary underline transition-colors duration-200" href="#">Shipping Info</a>
<a class="text-secondary hover:text-primary underline transition-colors duration-200" href="#">Contact Us</a>
</div>
</div>
</footer>
<script src="/js/main.js"></script>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            renderCartPage();

            document.getElementById('checkout-btn').addEventListener('click', () => {
                const cart = Cart.get();
                if (cart.length === 0) {
                    showToast('Your cart is empty', 'warning');
                    return;
                }

                if (!Auth.isLoggedIn()) {
                    showToast('Please sign in to complete your checkout', 'info');
                    setTimeout(() => {
                        window.location.href = '/login.html';
                    }, 1000);
                } else {
                    window.location.href = '/checkout.html';
                }
            });
        });

        function renderCartPage() {
            const cart = Cart.get();
            const itemsList = document.getElementById('cart-items-list');
            const mainContainer = document.getElementById('cart-content-container');

            if (cart.length === 0) {
                mainContainer.innerHTML = `
                    <div class="col-span-full py-xl text-center flex flex-col items-center justify-center text-on-surface-variant">
                        <span class="material-symbols-outlined text-[64px] mb-sm opacity-50">shopping_cart</span>
                        <p class="font-headline-md text-headline-md mb-xs">Your cart is empty</p>
                        <p class="font-body-md text-body-md mb-md">Add refined minimalist products to get started.</p>
                        <a href="/products.html" class="h-lg px-lg bg-primary text-on-primary font-label-lg text-label-lg rounded flex items-center justify-center hover:bg-primary-container transition-colors shadow-sm">
                            Shop Products
                        </a>
                    </div>
                `;
                return;
            }

            let subtotal = 0;

            itemsList.innerHTML = cart.map(item => {
                const totalItemPrice = item.price * item.quantity;
                subtotal += totalItemPrice;
                
                return `
                    <div class="flex flex-col sm:flex-row gap-md bg-surface-container-lowest p-md rounded-lg shadow-sm border border-surface-variant relative transition-all duration-200 hover:border-primary">
                        <div class="w-full sm:w-32 h-32 flex-shrink-0 bg-surface-container-low rounded overflow-hidden" onclick="window.location.href='/product-details.html?id=${item.id}'">
                            <img src="${item.image_url}" alt="${item.name}" class="w-full h-full object-cover rounded cursor-pointer">
                        </div>
                        <div class="flex-grow flex flex-col justify-between">
                            <div>
                                <h3 class="font-headline-md text-headline-md cursor-pointer hover:text-primary transition-colors" onclick="window.location.href='/product-details.html?id=${item.id}'">${item.name}</h3>
                                <p class="text-secondary font-body-md text-body-md mt-1">$${item.price.toFixed(2)} each</p>
                            </div>
                            <div class="flex justify-between items-end mt-4">
                                <div class="flex items-center border border-outline rounded bg-surface-container-lowest overflow-hidden h-[36px]">
                                    <button aria-label="Decrease quantity" class="px-3 h-full hover:bg-surface-container hover:text-primary transition-colors" onclick="updateQty(${item.id}, ${item.quantity - 1})">
                                        <span class="material-symbols-outlined text-[14px]">remove</span>
                                    </button>
                                    <span class="px-4 font-label-lg text-label-lg">${item.quantity}</span>
                                    <button aria-label="Increase quantity" class="px-3 h-full hover:bg-surface-container hover:text-primary transition-colors" onclick="updateQty(${item.id}, ${item.quantity + 1})">
                                        <span class="material-symbols-outlined text-[14px]">add</span>
                                    </button>
                                </div>
                                <span class="font-headline-md text-headline-md text-primary">$${totalItemPrice.toFixed(2)}</span>
                            </div>
                        </div>
                        <button aria-label="Remove item" class="absolute top-4 right-4 text-secondary hover:text-error transition-colors" onclick="removeItem(${item.id})">
                            <span class="material-symbols-outlined">close</span>
                        </button>
                    </div>
                `;
            }).join('');

            document.getElementById('summary-subtotal').textContent = `$${subtotal.toFixed(2)}`;
            document.getElementById('summary-total').textContent = `$${subtotal.toFixed(2)}`;
        }

        function updateQty(id, qty) {
            Cart.updateQty(id, qty);
            renderCartPage();
        }

        function removeItem(id) {
            Cart.remove(id);
            renderCartPage();
        }
    </script>
</body></html>
